<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/png" href="Images/site-images-1/Asset-2.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page Not Found · Premier Rheumatology</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/style.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel">

const NotFoundPage = () => {
  const isMobile = useIsMobile();
  const pl = palette;

  const links = [
    { label: 'Home', href: 'index.html', desc: 'Back to the main page' },
    { label: 'Conditions We Treat', href: 'conditions.html', desc: 'Browse our full conditions library' },
    { label: 'Our Team', href: 'team.html', desc: 'Meet our physicians and staff' },
    { label: 'Florida Office', href: 'florida.html', desc: 'Boca Raton · (561) 730-3894' },
    { label: 'New York Office', href: 'new-york.html', desc: 'Queens · (718) 347-8888' },
    { label: 'Contact Us', href: 'contact.html', desc: 'Send us a message or find our offices' },
  ];

  return (
    <PageShell active="">
      {/* Hero */}
      <section style={{
        padding: isMobile ? '72px 20px 56px' : '120px 56px 100px',
        background: pl.card,
        borderBottom: `1px solid ${pl.line}`,
        textAlign: 'center',
      }}>
        {/* Big 404 */}
        <div style={{
          fontFamily: SERIF,
          fontSize: isMobile ? 120 : 200,
          fontWeight: 500,
          letterSpacing: '-0.04em',
          lineHeight: 1,
          marginBottom: 8,
          background: `linear-gradient(135deg, ${pl.purpleDeep} 0%, ${pl.purple} 60%, ${pl.accent} 100%)`,
          WebkitBackgroundClip: 'text',
          WebkitTextFillColor: 'transparent',
          backgroundClip: 'text',
          userSelect: 'none',
        }}>404</div>

        <div style={{ fontFamily: SERIF, fontSize: isMobile ? 28 : 42, fontWeight: 500, letterSpacing: '-0.02em', color: pl.ink, marginBottom: 16, lineHeight: 1.15 }}>
          This page doesn&apos;t exist.
        </div>
        <p style={{ fontSize: isMobile ? 16 : 18, color: pl.sub, lineHeight: 1.65, maxWidth: 520, margin: '0 auto 40px' }}>
          The page you&apos;re looking for may have moved, been renamed, or never existed.
          Let&apos;s get you somewhere helpful.
        </p>

        <div style={{ display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap' }}>
          <a href="index.html" style={{ textDecoration: 'none' }}>
            <button style={{
              background: pl.purple, color: '#fff', border: 'none',
              padding: '15px 30px', borderRadius: 999, fontSize: 15, fontWeight: 600,
              cursor: 'pointer', fontFamily: 'inherit',
              display: 'inline-flex', alignItems: 'center', gap: 10,
            }}>
              Go to homepage
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </a>
          <a href="contact.html" style={{ textDecoration: 'none' }}>
            <button style={{
              background: 'transparent', color: pl.ink,
              border: `1px solid ${pl.line}`,
              padding: '16px 28px', borderRadius: 12, fontSize: 15, fontWeight: 600,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              Contact us
            </button>
          </a>
        </div>
      </section>

      {/* Quick links */}
      <section style={{ padding: isMobile ? '48px 20px 72px' : '80px 56px 100px' }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: pl.sub, marginBottom: 28 }}>
          Where would you like to go?
        </div>
        <div style={{
          display: 'grid',
          gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)',
          gap: 12,
        }}>
          {links.map((l, i) => (
            <a key={i} href={l.href} style={{ textDecoration: 'none', color: 'inherit' }}>
              <div style={{
                border: `1px solid ${pl.line}`,
                borderRadius: 14,
                padding: '22px 24px',
                background: pl.card,
                display: 'flex',
                alignItems: 'center',
                gap: 16,
                transition: 'border-color 0.15s, transform 0.15s',
                cursor: 'pointer',
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = pl.ink; e.currentTarget.style.transform = 'translateY(-2px)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = pl.line; e.currentTarget.style.transform = 'translateY(0)'; }}
              >
                <div style={{
                  width: 40, height: 40, borderRadius: 10,
                  background: pl.purpleLight,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexShrink: 0,
                }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M5 12h14M13 6l6 6-6 6" stroke={pl.purple} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 3 }}>{l.label}</div>
                  <div style={{ fontSize: 13, color: pl.sub, lineHeight: 1.4 }}>{l.desc}</div>
                </div>
              </div>
            </a>
          ))}
        </div>
      </section>
    </PageShell>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<NotFoundPage />);
</script>
</body>
</html>
